name: Swarm Drones Framework CI

on:
  push:
    branches: [ master, main, phase-1-foundations-packaging ]
  pull_request:
    branches: [ master, main, phase-1-foundations-packaging ]

jobs:
  test:
    name: Unit & Regression Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Package and Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite
        run: |
          python -m pytest -v

      - name: Run Reproducible Smoke Experiment
        run: |
          python experiments/run_demo.py \
            --profile assumed_baseline \
            --seed 123 \
            --output-dir "${{ runner.temp }}/swarm-demo-results"
