[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-drones-fyp"
version = "0.2.0"
description = "Autonomous Swarm Drones Coordinated Movement Framework (Final Year Project BEE-60)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "FYP Swarm Team", email = "swarm.drones.fyp@ee.dept"}
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
sitl = [
    "pymavlink>=2.4.40",
]
all = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pymavlink>=2.4.40",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm_core*", "simulator*", "sitl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q"
filterwarnings = [
    "ignore:Unable to import Axes3D:UserWarning",
]
