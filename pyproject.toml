[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-drones-fyp"
version = "0.1.0"
description = "Autonomous swarm drone control: centralized, decentralized and hybrid formation flight with ArduPilot SITL validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
# MAVLink / ArduPilot SITL scripts and experiments/validate_*.py
sitl = [
    "pymavlink>=2.4",
    "pandas>=1.5",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
include = ["swarm_core*", "simulator*", "sitl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
